# Full local stack: MongoDB + MinIO (S3-compatible, persistent volume) + API + cleanup worker + web (nginx).
#   cp .env.example .env && docker compose up --build
# Open http://localhost:8080  (MinIO console: http://localhost:9001)
#
# For day-to-day development run only the data services and start the apps with npm:
#   docker compose up -d mongo minio minio-init
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ['127.0.0.1:27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_BUCKET: ${S3_BUCKET:-fileshare}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        (mc ilm rule add --expire-days 31 "local/$$S3_BUCKET" || true)

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/fileshare
      RUN_WORKER_IN_API: 'false'
    depends_on:
      mongo: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes: [local-storage:/data/storage] # only used when STORAGE_PROVIDER=local

  worker:
    build: ./backend
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/fileshare
    depends_on:
      mongo: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes: [local-storage:/data/storage]
    healthcheck: { disable: true }

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:4000
    depends_on: [backend]
    ports: ['${WEB_PORT:-8080}:80']

volumes:
  mongo-data:
  minio-data:
  local-storage:
