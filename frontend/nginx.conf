# Rendered by the nginx image's envsubst templating; ${API_UPSTREAM} comes from the environment.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Parts are PART_SIZE_BYTES (8 MiB default) each; allow headroom but never whole 3 GB bodies.
  client_max_body_size 64m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream uploads and downloads straight through; never spool multi-GB bodies to nginx's disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_body_timeout 1800s;
  }
  location /health/ { proxy_pass ${API_UPSTREAM}; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
